[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Astro static — pas d’adapter Netlify requis
# Rebuilds :
# - automatique sur push GitHub → main
# - manuel depuis Sanity (« Mettre en ligne ») via un Build Hook Netlify
# Ne pas brancher de webhook Sanity → Netlify (évite un rebuild à chaque publish)
